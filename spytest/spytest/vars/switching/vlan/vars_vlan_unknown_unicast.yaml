# VLAN Unknown Unicast Flooding Test Variables (TC_VLAN_FORWARD_005)
defaults:
  cli_type: klish
  min_topology: ["D1D2:3"]
  verify_timeout: 30
  cleanup: true
  vlan_id: "10"

testcases:
  "TC_VLAN_FORWARD_005":
    title: "Unknown Unicast Flooding"
    description: |
      Verify that unknown unicast frames are flooded to all ports in the same VLAN.
    test_type: "vlan_unknown_unicast_flooding"

    vlans:
      vlan_10: 10

    ports:
      port1:
        vlans: [10]
        mode: "access"
        state: "up"
        shutdown: false

      port2:
        vlans: [10]
        mode: "access"
        state: "up"
        shutdown: false

      port3:
        vlans: [10]
        mode: "access"
        state: "up"
        shutdown: false

    traffic:
      method: "scapy"
      packet_count: 10
      packet_size: 64
      packet_type: "ethernet"
      packet_rate: 1000
      duration: 5
      frame_format:
        type: "ethernet"
        src_mac: "auto"
        dst_mac: "00:11:22:33:44:55"
        vlan_tag: null
        vlan_priority: 0
        ethertype: "0x0800"

    capture:
      method: "tcpdump"
      interfaces: ["port2", "port3"]
      bpf_filter: "ether dst 00:11:22:33:44:55"
      timeout: 30
      output_format: "pcap"

    verification:
      verify_vlan_config: true
      verify_port_config: true
      verify_flooding: true
      expected_flooding_all_ports: true
      max_packet_loss_percent: 20
      use_show_running_config: true

    packet_capture:
      enabled: true
      capture_paths:
        - "/tmp/vlan_unknown_unicast_port2.pcap"
        - "/tmp/vlan_unknown_unicast_port3.pcap"
      unknown_dst_mac_filter: "00:11:22:33:44:55"
      expected_packets_per_port: 10

    flooding:
      verify_all_vlan_ports_flooded: true
      verify_port2_receives_flooding: true
      verify_port3_receives_flooding: true
      unknown_unicast_detection_exact_match: true

    error_handling:
      save_diagnostics: true
      diagnostics_path: "/tmp/vlan_unknown_unicast_diagnostics"

    cleanup:
      cleanup_vlans: true
      cleanup_ports: true
      cleanup_pcaps: true

global:
  retain_pcaps: false
  diagnostics_level: "full"
  max_retries: 0
  test_timeout: 300

integration:
  enabled: false
  ci_system: "github"
  report_format: "junit"
