# VLAN Inter-VLAN Isolation Test Variables (TC_VLAN_FORWARD_004)
defaults:
  cli_type: klish
  min_topology: ["D1D2:2"]
  verify_timeout: 30
  cleanup: true
  vlan_10_id: "10"
  vlan_20_id: "20"

testcases:
  "TC_VLAN_FORWARD_004":
    title: "Inter-VLAN Isolation"
    description: |
      Verify that traffic is isolated between different VLANs.
    test_type: "vlan_inter_vlan_isolation"

    vlans:
      vlan_10: 10
      vlan_20: 20

    ports:
      port1:
        vlans: [10]
        mode: "access"
        state: "up"
        shutdown: false

      port2:
        vlans: [20]
        mode: "access"
        state: "up"
        shutdown: false

    traffic:
      method: "scapy"
      packet_count: 10
      packet_size: 64
      packet_type: "ethernet"
      packet_rate: 1000
      duration: 5
      frame_format:
        type: "ethernet"
        src_mac: "auto"
        dst_mac: "auto"
        vlan_tag: null
        vlan_priority: 0
        ethertype: "0x0800"

    capture:
      method: "tcpdump"
      interface: "port2"
      bpf_filter: null
      timeout: 30
      output_format: "pcap"

    verification:
      verify_vlan_config: true
      verify_port_config: true
      verify_isolation: true
      verify_no_packet_receipt: true
      expected_no_cross_vlan_traffic: true
      expected_packets: 0
      max_packet_loss_percent: 100
      use_show_running_config: true

    packet_capture:
      enabled: true
      capture_path: "/tmp/vlan_inter_isolation_port2.pcap"
      isolation_detection_empty_pcap: true

    error_handling:
      save_diagnostics: true
      diagnostics_path: "/tmp/vlan_inter_isolation_diagnostics"

    cleanup:
      cleanup_vlans: true
      cleanup_ports: true
      cleanup_pcaps: true

global:
  retain_pcaps: false
  diagnostics_level: "full"
  max_retries: 0
  test_timeout: 300

integration:
  enabled: false
  ci_system: "github"
  report_format: "junit"
