# VLAN Access Port Same VLAN Communication Test Variables (TC_VLAN_ACCESS_003)
defaults:
  cli_type: klish
  min_topology: ["D1D2:2"]
  verify_timeout: 30
  cleanup: true
  vlan_id: "10"

testcases:
  "TC_VLAN_ACCESS_003":
    title: "Access Port Same VLAN Communication"
    description: |
      Verify same-VLAN communication between two access ports using
      untagged packets.
    test_type: "vlan_access_same_vlan"

    vlans:
      vlan_10: 10

    ports:
      port1:
        vlans: [10]
        mode: "access"
        state: "up"
        shutdown: false

      port2:
        vlans: [10]
        mode: "access"
        state: "up"
        shutdown: false

    traffic:
      method: "scapy"
      packet_count: 10
      packet_size: 64
      packet_type: "ethernet"
      packet_rate: 1000
      duration: 5
      frame_format:
        type: "ethernet"
        src_mac: "auto"
        dst_mac: "auto"
        vlan_tag: null
        vlan_priority: 0
        ethertype: "0x0800"

    capture:
      method: "tcpdump"
      interface: "port2"
      bpf_filter: null
      timeout: 30
      output_format: "pcap"

    verification:
      verify_vlan_config: true
      verify_port_config: true
      verify_packet_capture: true
      verify_communication: true
      max_packet_loss_percent: 20
      use_show_running_config: true

    packet_capture:
      enabled: true
      capture_path: "/tmp/vlan_access_port2.pcap"
      expected_packets: 10

    error_handling:
      save_diagnostics: true
      diagnostics_path: "/tmp/vlan_access_diagnostics"

    cleanup:
      cleanup_vlans: true
      cleanup_ports: true
      cleanup_pcaps: true

global:
  retain_pcaps: false
  diagnostics_level: "full"
  max_retries: 0
  test_timeout: 300

integration:
  enabled: false
  ci_system: "github"
  report_format: "junit"
