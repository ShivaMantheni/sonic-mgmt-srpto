# IPv6 ACL Test Configuration File
# Format: YAML
# Purpose: Configure IPv6 ACL test cases with address, port, and traffic generation parameters
# Version: 1.0
# Date: 2026-05-01

defaults:
  # Topology requirements
  min_topology:
    - "D1D2:1"  # DUT1 connected to DUT2
    - "D1D3:1"  # DUT1 connected to DUT3

  # Default threshold values for packet count verification
  # Different thresholds for virtual vs hardware platforms
  thresholds:
    virtual:
      pass_percentage: 95  # 95% packets expected on virtual platforms
    hardware:
      pass_percentage: 98  # 98% packets expected on hardware platforms

  # Default traffic parameters
  traffic:
    duration: 10  # seconds
    pps: 10       # packets per second
    payload_size: 22  # bytes

  # Default ACL configuration
  acl:
    type: "L3"
    policy_desc: "IPv6_ACL"

  # IPv6 addressing scheme
  ipv6_addressing:
    dut1:
      interface: "Vlan100"
      ipv6_address: "2001:db8:1::1/64"
    dut2:
      interface: "Vlan100"
      ipv6_address: "2001:db8:1::2/64"
    dut3:
      interface: "Vlan100"
      ipv6_address: "2001:db8:1::3/64"


# ============================================================================
# TEST CASES - BASELINE TESTS
# ============================================================================

test_cases:

  # TEST 001: Permit All IPv6 Traffic
  ipv6_baseline_permit_all:
    description: "IPv6 ACL - Permit All Traffic"
    acl_table: "IPV6_PERMIT_ALL"
    rules:
      - rule_id: 1
        description: "Permit all IPv6 traffic"
        action: "PERMIT"
        protocol: "all"
        src_ipv6: "::/0"
        dst_ipv6: "::/0"
    traffic:
      src_ipv6: "2001:db8:1::2"
      dst_ipv6: "2001:db8:1::3"
      protocol: "udp"
      duration: 10
      pps: 10
      expected_result: "PERMIT"
    ipv6_config:
      dut1: "2001:db8:1::1/64"
      dut2: "2001:db8:1::2/64"
      dut3: "2001:db8:1::3/64"

  # TEST 002: Deny Specific Source
  ipv6_baseline_deny_source:
    description: "IPv6 ACL - Deny Specific Source"
    acl_table: "IPV6_DENY_SOURCE"
    rules:
      - rule_id: 1
        description: "Deny traffic from 2001:db8:1::2"
        action: "DENY"
        protocol: "all"
        src_ipv6: "2001:db8:1::2/128"
        dst_ipv6: "::/0"
      - rule_id: 2
        description: "Permit all other traffic"
        action: "PERMIT"
        protocol: "all"
        src_ipv6: "::/0"
        dst_ipv6: "::/0"
    traffic:
      src_ipv6: "2001:db8:1::2"
      dst_ipv6: "2001:db8:1::3"
      protocol: "udp"
      duration: 10
      pps: 10
      expected_result: "DENY"

  # TEST 003: TCP Port Matching (Port 443 - HTTPS)
  ipv6_baseline_tcp_port:
    description: "IPv6 ACL - TCP Port Matching"
    acl_table: "IPV6_TCP_443"
    rules:
      - rule_id: 1
        description: "Deny TCP port 443 (HTTPS)"
        action: "DENY"
        protocol: "tcp"
        src_ipv6: "::/0"
        dst_ipv6: "::/0"
        dst_port: 443
      - rule_id: 2
        description: "Permit all other traffic"
        action: "PERMIT"
        protocol: "all"
        src_ipv6: "::/0"
        dst_ipv6: "::/0"
    traffic:
      src_ipv6: "2001:db8:1::2"
      dst_ipv6: "2001:db8:1::3"
      protocol: "tcp"
      dst_port: 443
      tcp_flags: "S"  # SYN flag
      duration: 10
      pps: 10
      expected_result: "DENY"

  # TEST 004: UDP Port Matching (Port 53 - DNS)
  ipv6_baseline_udp_port:
    description: "IPv6 ACL - UDP Port Matching"
    acl_table: "IPV6_UDP_53"
    rules:
      - rule_id: 1
        description: "Permit UDP port 53 (DNS)"
        action: "PERMIT"
        protocol: "udp"
        src_ipv6: "::/0"
        dst_ipv6: "::/0"
        dst_port: 53
      - rule_id: 2
        description: "Deny all other traffic"
        action: "DENY"
        protocol: "all"
        src_ipv6: "::/0"
        dst_ipv6: "::/0"
    traffic:
      src_ipv6: "2001:db8:1::2"
      dst_ipv6: "2001:db8:1::3"
      protocol: "udp"
      dst_port: 53
      duration: 10
      pps: 10
      expected_result: "PERMIT"

  # TEST 005: ICMPv6 Protocol Matching
  ipv6_baseline_icmpv6:
    description: "IPv6 ACL - ICMPv6 Protocol Matching"
    acl_table: "IPV6_ICMPV6"
    rules:
      - rule_id: 1
        description: "Permit ICMPv6 echo request (ping)"
        action: "PERMIT"
        protocol: "icmpv6"
        icmpv6_type: 128  # Echo request
        src_ipv6: "::/0"
        dst_ipv6: "::/0"
      - rule_id: 2
        description: "Deny all other traffic"
        action: "DENY"
        protocol: "all"
        src_ipv6: "::/0"
        dst_ipv6: "::/0"
    traffic:
      src_ipv6: "2001:db8:1::2"
      dst_ipv6: "2001:db8:1::3"
      protocol: "icmpv6"
      icmpv6_type: 128
      duration: 10
      pps: 10
      expected_result: "PERMIT"

  # TEST 006: Rule Precedence (First Match Wins)
  ipv6_baseline_precedence:
    description: "IPv6 ACL - Rule Precedence"
    acl_table: "IPV6_PRECEDENCE"
    rules:
      - rule_id: 1
        description: "Deny all IPv6 traffic"
        action: "DENY"
        protocol: "all"
        src_ipv6: "::/0"
        dst_ipv6: "::/0"
      - rule_id: 2
        description: "Permit traffic from 2001:db8:1::2 (should not be reached)"
        action: "PERMIT"
        protocol: "all"
        src_ipv6: "2001:db8:1::2/128"
        dst_ipv6: "::/0"
    traffic:
      src_ipv6: "2001:db8:1::2"
      dst_ipv6: "2001:db8:1::3"
      protocol: "udp"
      duration: 10
      pps: 10
      expected_result: "DENY"  # First rule DENY should match

  # TEST 007: Compressed IPv6 Address Format
  ipv6_baseline_compressed:
    description: "IPv6 ACL - Compressed Address Format"
    acl_table: "IPV6_COMPRESSED"
    rules:
      - rule_id: 1
        description: "Permit traffic from 2001:db8::2"
        action: "PERMIT"
        protocol: "all"
        src_ipv6: "2001:db8::2/128"  # Compressed format
        dst_ipv6: "::/0"
      - rule_id: 2
        description: "Deny all other traffic"
        action: "DENY"
        protocol: "all"
        src_ipv6: "::/0"
        dst_ipv6: "::/0"
    traffic:
      src_ipv6: "2001:db8::2"  # Compressed format
      dst_ipv6: "2001:db8:1::3"
      protocol: "udp"
      duration: 10
      pps: 10
      expected_result: "PERMIT"

  # TEST 008: IPv6 Multicast Filtering
  ipv6_baseline_multicast:
    description: "IPv6 ACL - Multicast Filtering"
    acl_table: "IPV6_MULTICAST"
    rules:
      - rule_id: 1
        description: "Deny IPv6 multicast traffic (ff00::/8)"
        action: "DENY"
        protocol: "all"
        dst_ipv6: "ff00::/8"
        src_ipv6: "::/0"
      - rule_id: 2
        description: "Permit all other traffic"
        action: "PERMIT"
        protocol: "all"
        src_ipv6: "::/0"
        dst_ipv6: "::/0"
    traffic:
      src_ipv6: "2001:db8:1::2"
      dst_ipv6: "ff02::1"  # All nodes multicast address
      protocol: "udp"
      duration: 10
      pps: 10
      expected_result: "DENY"

  # TEST 009: Link-Local Address Filtering
  ipv6_baseline_linklocal:
    description: "IPv6 ACL - Link-Local Filtering"
    acl_table: "IPV6_LINKLOCAL"
    rules:
      - rule_id: 1
        description: "Permit link-local traffic (fe80::/10)"
        action: "PERMIT"
        protocol: "all"
        src_ipv6: "fe80::/10"
        dst_ipv6: "::/0"
      - rule_id: 2
        description: "Deny all other traffic"
        action: "DENY"
        protocol: "all"
        src_ipv6: "::/0"
        dst_ipv6: "::/0"
    traffic:
      src_ipv6: "fe80::1"  # Link-local source
      dst_ipv6: "2001:db8:1::3"
      protocol: "udp"
      duration: 10
      pps: 10
      expected_result: "PERMIT"

  # TEST 010: Port Range Matching
  ipv6_baseline_port_range:
    description: "IPv6 ACL - Port Range Matching"
    acl_table: "IPV6_PORT_RANGE"
    rules:
      - rule_id: 1
        description: "Deny TCP port range 1024-65535"
        action: "DENY"
        protocol: "tcp"
        src_ipv6: "::/0"
        dst_ipv6: "::/0"
        dst_port_range: "1024-65535"
      - rule_id: 2
        description: "Permit privileged ports (< 1024)"
        action: "PERMIT"
        protocol: "tcp"
        src_ipv6: "::/0"
        dst_ipv6: "::/0"
    traffic:
      src_ipv6: "2001:db8:1::2"
      dst_ipv6: "2001:db8:1::3"
      protocol: "tcp"
      dst_port: 2000  # Within 1024-65535 range
      duration: 10
      pps: 10
      expected_result: "DENY"

  # TEST 011: Subnet Mask Matching
  ipv6_baseline_subnet:
    description: "IPv6 ACL - Subnet Mask Matching"
    acl_table: "IPV6_SUBNET"
    rules:
      - rule_id: 1
        description: "Permit traffic from 2001:db8::/32 subnet"
        action: "PERMIT"
        protocol: "all"
        src_ipv6: "2001:db8::/32"
        dst_ipv6: "::/0"
      - rule_id: 2
        description: "Deny all other traffic"
        action: "DENY"
        protocol: "all"
        src_ipv6: "::/0"
        dst_ipv6: "::/0"
    traffic:
      src_ipv6: "2001:db8:1234::2"  # Within 2001:db8::/32
      dst_ipv6: "2001:db8:1::3"
      protocol: "udp"
      duration: 10
      pps: 10
      expected_result: "PERMIT"

  # TEST 012: Any Source/Destination (::/0)
  ipv6_baseline_any:
    description: "IPv6 ACL - Any Source/Destination"
    acl_table: "IPV6_ANY"
    rules:
      - rule_id: 1
        description: "Permit all IPv6 traffic (using ::/0)"
        action: "PERMIT"
        protocol: "all"
        src_ipv6: "::/0"
        dst_ipv6: "::/0"
    traffic:
      src_ipv6: "2001:db8:1::2"
      dst_ipv6: "2001:db8:1::3"
      protocol: "udp"
      duration: 10
      pps: 10
      expected_result: "PERMIT"

  # TEST 013: Uncompressed IPv6 Address Format
  ipv6_baseline_uncompressed:
    description: "IPv6 ACL - Uncompressed Address Format"
    acl_table: "IPV6_UNCOMPRESSED"
    rules:
      - rule_id: 1
        description: "Permit traffic from uncompressed IPv6 address"
        action: "PERMIT"
        protocol: "all"
        src_ipv6: "2001:0db8:0000:0000:0000:0000:0000:0002/128"
        dst_ipv6: "::/0"
      - rule_id: 2
        description: "Deny all other traffic"
        action: "DENY"
        protocol: "all"
        src_ipv6: "::/0"
        dst_ipv6: "::/0"
    traffic:
      src_ipv6: "2001:0db8:0000:0000:0000:0000:0000:0002"
      dst_ipv6: "2001:db8:1::3"
      protocol: "udp"
      duration: 10
      pps: 10
      expected_result: "PERMIT"

  # TEST 014: Multiple ACL Tables
  ipv6_baseline_multi_tables:
    description: "IPv6 ACL - Multiple ACL Tables"
    acl_tables:
      - table_name: "IPV6_TABLE_1"
        description: "First IPv6 ACL table"
        rules:
          - rule_id: 1
            action: "PERMIT"
            protocol: "all"
            src_ipv6: "2001:db8:1::/64"
            dst_ipv6: "::/0"
      - table_name: "IPV6_TABLE_2"
        description: "Second IPv6 ACL table"
        rules:
          - rule_id: 1
            action: "PERMIT"
            protocol: "tcp"
            src_ipv6: "::/0"
            dst_ipv6: "::/0"
            dst_port: 443
    traffic:
      src_ipv6: "2001:db8:1::2"
      dst_ipv6: "2001:db8:1::3"
      protocol: "udp"
      duration: 10
      pps: 10
      expected_result: "PERMIT"

  # TEST 015: ACL Unbind and Rebind
  ipv6_baseline_rebind:
    description: "IPv6 ACL - Unbind and Rebind"
    acl_table: "IPV6_REBIND"
    rules:
      - rule_id: 1
        description: "Permit all IPv6 traffic"
        action: "PERMIT"
        protocol: "all"
        src_ipv6: "::/0"
        dst_ipv6: "::/0"
    traffic:
      src_ipv6: "2001:db8:1::2"
      dst_ipv6: "2001:db8:1::3"
      protocol: "udp"
      duration: 10
      pps: 10
      expected_result: "PERMIT"
    operations:
      - operation: "bind"
        description: "Bind ACL to ingress interface"
      - operation: "unbind"
        description: "Unbind ACL from interface"
      - operation: "rebind"
        description: "Rebind ACL to interface"
      - operation: "verify"
        description: "Verify ACL functionality after rebind"


# ============================================================================
# NEGATIVE TEST CASES - Edge Cases and Boundary Conditions
# (To be implemented in test_ipv6_acl_negative.py)
# ============================================================================

negative_test_cases:
  # N01: Invalid IPv6 Address Format
  # N02: Overlapping Subnet Ranges
  # N03: ICMPv6 Type/Code Combinations
  # N04: Protocol Zero (Undefined)
  # N05: Port Edge Cases (0, 65535, etc.)
  # N06: TCP Flags with IPv6
  # N07: IPv4-mapped IPv6 Addresses
  # N08: Multicast with TTL=1
  # N09: ACL Rule Count Limits
  # N10: Dynamic Rule Modifications
  # ... (15 negative test cases defined in test plan)


# ============================================================================
# ROBUSTNESS TEST CASES - Stress and Scale Testing
# (To be implemented in test_ipv6_acl_robustness.py)
# ============================================================================

robustness_test_cases:
  # R01: Large Number of Rules (100+)
  # R02: Rapid Rule Addition/Deletion
  # R03: High-Speed Traffic Generation
  # R04: Device Reboot with ACL Persistence
  # R05: Memory Usage Under Load
  # ... (15 robustness test cases defined in test plan)
