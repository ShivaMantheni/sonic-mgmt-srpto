# VLAN Trunk-to-Trunk Tagged Packet Forwarding Test Variables (TC_VLAN_TAG_003)
# Author: Test Automation Team
# Date: 2026-05-06
#
# This YAML file contains configuration for TC_VLAN_TAG_003: Tagged Packet on Trunk Port
#
# Test Scenario:
#   Verify that tagged packets sent on a trunk port are received with the same VLAN tag
#   on another trunk port (trunk-to-trunk forwarding without tag stripping per IEEE 802.1Q)
#
# Test Logic:
#   Source: Trunk port (Port3/D1) sends VLAN 10 tagged packet
#   Switch: Forwards tagged packet between trunk ports
#   Destination: Trunk port (Port5/D2) receives packet with VLAN 10 tag intact

defaults:
  # CLI Type: Use klish for all commands
  cli_type: klish

  # Topology requirement: Two DUTs with 2+ connections
  # Format: "D1D2:2" means DUT1-DUT2 with 2 connections
  min_topology:
    - "D1D2:2"

  # Verification timeout in seconds
  verify_timeout: 30

  # Enable cleanup after test (remove VLANs and port configs)
  cleanup: true

  # Interface selection strategy
  # Options: "auto" (discover available), "manual" (use manual_interface)
  interface_selection: "auto"

  # Manual interface (if interface_selection is "manual")
  # Example: "Ethernet272"
  manual_interface: null

  # Default port roles
  # Port1: Trunk port (source, sends tagged)
  # Port2: Trunk port (destination, receives tagged)
  port_roles:
    trunk_port: "Port1"
    trunk_port_2: "Port2"

testcases:
  # TC_VLAN_TAG_003: Tagged Packet on Trunk Port
  "TC_VLAN_TAG_003":
    title: "Tagged Packet on Trunk Port"

    description: |
      Verify tagged packets sent on a trunk port are received with the same VLAN tag
      on another trunk port (802.1Q compliance for trunk-to-trunk forwarding).

    test_type: "vlan_trunk_tagging"

    # VLAN Configuration
    vlans:
      # Primary VLAN (test VLAN)
      vlan_10: 10

    # Port Configuration
    ports:
      # Trunk port 1 configuration (Source - D1)
      trunk_port:
        vlans: [10]           # Allowed VLANs on trunk
        mode: "trunk"
        state: "up"
        shutdown: false
        native_vlan: 1

      # Trunk port 2 configuration (Destination - D2)
      trunk_port_2:
        vlans: [10]           # Allowed VLANs on trunk
        mode: "trunk"
        state: "up"
        shutdown: false
        native_vlan: 1

    # Traffic Generation Parameters
    traffic:
      # Packet generation method
      method: "scapy"  # Options: "scapy", "ixia", "ixiaapi"

      # Number of packets to send (tagged from trunk)
      packet_count: 10

      # Packet size in bytes
      packet_size: 64  # Minimum 64 bytes for Ethernet frame

      # Packet type
      packet_type: "ethernet"  # Tagged Ethernet frame with 802.1Q

      # Packet rate (pps = packets per second)
      packet_rate: 1000

      # Traffic duration in seconds
      duration: 5

      # Frame format
      frame_format:
        type: "ethernet"        # L2 frame
        src_mac: "auto"         # Auto-discover from trunk interface
        dst_mac: "auto"         # Auto-discover from destination interface
        vlan_tag: 10            # Tag with VLAN 10 on ingress (already tagged)
        vlan_priority: 0        # 802.1Q Priority Code Point
        ethertype: "0x0800"     # IPv4

    # Capture Configuration
    capture:
      # Packet capture method
      method: "tcpdump"  # Options: "tcpdump", "wireshark", "tshark"

      # Interface to capture on (destination trunk port)
      interface: "Port2"

      # Capture filters
      bpf_filter: "vlan"  # Filter for VLAN tagged packets

      # Capture timeout
      timeout: 15  # seconds

      # Output format
      output_format: "pcap"

      # Keep capture file for analysis
      keep_pcap: false  # Set to true to keep pcap file

    # Verification Parameters
    verification:
      # Verify VLAN configuration
      verify_vlan_config: true

      # Verify port VLAN configuration
      verify_port_config: true

      # Verify packet capture
      verify_capture: true

      # Verify PACKETS ARE TAGGED (with 802.1Q header)
      verify_tagged: true

      # Expected behavior: packets should RETAIN VLAN tag (no tag stripping on trunk-trunk)
      expected_tagged: true

      # Expected VLAN ID in tag
      expected_vlan_id: 10

      # Acceptable packet loss percentage
      max_packet_loss_percent: 10

      # Verify using running-configuration
      use_show_running_config: true

    # Logging Configuration
    logging:
      # Log level: "debug", "info", "warning", "error"
      level: "debug"

      # Log captured packets in detail
      log_packets: true

      # Log interface counters
      log_counters: true

      # Log configuration changes
      log_config: true

    # Performance Configuration
    performance:
      # Measure packet transmission time
      measure_latency: false

      # Measure throughput
      measure_throughput: false

      # CPU/Memory monitoring
      monitor_resources: false

    # Error Handling
    error_handling:
      # Continue on minor errors
      continue_on_error: false

      # Save diagnostic data on failure
      save_diagnostics: true

      # Diagnostic capture location
      diagnostics_path: "/tmp/vlan_tag_003_diagnostics"

    # Cleanup Configuration
    cleanup:
      # Clean up VLANs
      cleanup_vlans: true

      # Clean up port configurations
      cleanup_ports: true

      # Clean up pcap files
      cleanup_pcaps: true

      # Cleanup order (reverse order of creation)
      cleanup_order:
        - "ports"
        - "vlans"
        - "pcaps"

# Additional Test Cases for Future Implementation

# TC_VLAN_TAG_004: Q-in-Q Double Tagged (if implemented)
  "TC_VLAN_TAG_004":
    title: "Double Tagged Packet Handling"
    description: |
      Verify Q-in-Q (double-tagged) packet handling and behavior
      on trunk ports according to switch configuration.
    enabled: false

# Global Test Parameters (overrides per-test defaults if applicable)
global:
  # Packet capture retention
  retain_pcaps: false

  # Diagnostic level on failure
  diagnostics_level: "full"  # Options: "basic", "detailed", "full"

  # Test retry on failure
  max_retries: 0

  # Test timeout in seconds
  test_timeout: 300

  # Interface link speed detection
  auto_detect_speed: true

  # MTU verification
  verify_mtu: false

  # MAC address refresh
  mac_refresh_interval: 10  # seconds

# Integration Parameters (for CI/CD systems)
integration:
  # Enable integration mode
  enabled: false

  # CI/CD system type: "jenkins", "gitlab", "github", "azure"
  ci_system: "github"

  # Report format: "junit", "html", "json"
  report_format: "junit"

  # Report output location
  report_path: "/tmp/vlan_tag_003_report"

  # Metrics collection
  collect_metrics: false
