# BGP Show Commands Test Variables
# Author: Athira, 2026
#
# This YAML file defines test parameters for all 91 BGP show command test cases.
# Override using environment variable: BGP_SHOW_VAR_FILE

defaults:
  cli_type: klish
  verify_timeout: 30
  cleanup: true
  min_topology:
    - "D1D2:1"

  # BGP configuration
  local_asn: 65001
  remote_asn: 65002
  d1_bgp_neighbor: "10.0.24.2"  # D1's neighbor (D2's Ethernet32)
  d2_bgp_neighbor: "10.0.24.1"  # D2's neighbor (D1's Ethernet32)
  d1_ipv6: "2001:db8::1"
  d2_ipv6: "2001:db8::2"

testcases:
  # ========================================
  # BGP Summary Commands (TC-001 to TC-010)
  # ========================================

  TC-001:
    title: "Display global BGP summary (all address families)"
    command: "show bgp summary"
    cli_type: "klish"
    expected_fields:
      - "router identifier"
      - "local AS number"
      - "Neighbor"

  TC-002:
    title: "Display IPv4 unicast BGP summary"
    command: "show bgp ipv4 unicast summary"
    cli_type: "klish"
    expected_fields:
      - "IPv4 Unicast Summary"
      - "Neighbor"
      - "State/PfxRcd"

  TC-003:
    title: "Display IPv6 unicast BGP summary"
    command: "show bgp ipv6 unicast summary"
    cli_type: "klish"
    expected_fields:
      - "IPv6 Unicast"

  TC-004:
    title: "Display BGP summary for all VRFs"
    command: "show bgp ipv4 unicast vrf all summary"
    cli_type: "klish"
    expected_fields:
      - "Neighbor"

  TC-005:
    title: "Display BGP IPv4 summary in JSON format"
    command: "show bgp ipv4 unicast summary json"
    cli_type: "vtysh"
    expected_fields:
      - "ipv4Unicast"

  TC-006:
    title: "Display BGP IPv4 summary in wide format"
    command: "show bgp ipv4 unicast summary wide"
    cli_type: "vtysh"
    expected_fields:
      - "Neighbor"

  TC-007:
    title: "Display only established BGP IPv4 neighbors"
    command: "show bgp ipv4 unicast summary established"
    cli_type: "vtysh"
    expected_fields:
      - "Neighbor"

  TC-008:
    title: "Display only failed/non-established BGP IPv4 neighbors"
    command: "show bgp ipv4 unicast summary failed"
    cli_type: "vtysh"
    expected_output: "No failed neighbors or empty output"

  TC-009:
    title: "Display BGP IPv6 summary in JSON format"
    command: "show bgp ipv6 unicast summary json"
    cli_type: "vtysh"
    expected_fields:
      - "ipv6Unicast"

  TC-010:
    title: "Display BGP L2VPN EVPN summary"
    command: "show bgp l2vpn evpn summary"
    cli_type: "vtysh"
    expected_output: "EVPN summary or no neighbors configured"

  # ========================================
  # BGP Neighbor Commands (TC-011 to TC-025)
  # ========================================

  TC-011:
    title: "Display all IPv4 BGP neighbors"
    command: "show bgp ipv4 unicast neighbors"
    cli_type: "klish"
    expected_fields:
      - "BGP neighbor"
      - "remote AS"

  TC-012:
    title: "Display specific IPv4 BGP neighbor details"
    command: "show bgp ipv4 unicast neighbors <neighbor_ip>"
    cli_type: "klish"
    expected_fields:
      - "BGP neighbor"
      - "remote AS"
      - "BGP version"
      - "BGP state"

  TC-013:
    title: "Display routes advertised to a specific neighbor"
    command: "show bgp ipv4 unicast neighbors <neighbor_ip> advertised-routes"
    cli_type: "vtysh"
    expected_fields:
      - "Network"
      - "Next Hop"

  TC-014:
    title: "Display routes received from a specific neighbor"
    command: "show bgp ipv4 unicast neighbors <neighbor_ip> received-routes"
    cli_type: "vtysh"
    expected_output: "Received routes or soft-reconfiguration required message"

  TC-015:
    title: "Display all routes from a specific neighbor"
    command: "show bgp ipv4 unicast neighbors <neighbor_ip> routes"
    cli_type: "vtysh"
    expected_fields:
      - "Network"

  TC-016:
    title: "Display neighbor dampened routes"
    command: "show bgp ipv4 unicast neighbors <neighbor_ip> dampened-routes"
    cli_type: "vtysh"
    expected_output: "Dampened routes or empty if none"

  TC-017:
    title: "Display neighbor flap statistics"
    command: "show bgp ipv4 unicast neighbors <neighbor_ip> flap-statistics"
    cli_type: "vtysh"
    expected_output: "Flap statistics or not available"

  TC-018:
    title: "Display IPv6 BGP neighbors"
    command: "show bgp ipv6 unicast neighbors"
    cli_type: "klish"
    expected_output: "IPv6 neighbors or no neighbors configured"

  TC-019:
    title: "Display specific IPv6 neighbor details"
    command: "show bgp ipv6 unicast neighbors <ipv6_neighbor>"
    cli_type: "klish"
    expected_fields:
      - "BGP neighbor"

  TC-020:
    title: "Display neighbor capabilities"
    command: "show bgp neighbors <neighbor_ip> capabilities"
    cli_type: "vtysh"
    expected_fields:
      - "Neighbor capabilities"

  TC-021:
    title: "Display neighbor timers"
    command: "show bgp neighbors <neighbor_ip> timers"
    cli_type: "vtysh"
    expected_fields:
      - "Keepalive"
      - "Holdtime"

  TC-022:
    title: "Display neighbor route-refresh capability"
    command: "show bgp neighbors <neighbor_ip> route-refresh-capability"
    cli_type: "vtysh"
    expected_output: "Route refresh capability status"

  TC-023:
    title: "Display neighbor prefix-counts"
    command: "show bgp neighbors <neighbor_ip> prefix-counts"
    cli_type: "vtysh"
    expected_fields:
      - "Prefix"
      - "Count"

  TC-024:
    title: "Display neighbor connection details"
    command: "show bgp neighbors <neighbor_ip> connection"
    cli_type: "vtysh"
    expected_fields:
      - "Local host"
      - "Foreign host"

  TC-025:
    title: "Display all neighbors in JSON format"
    command: "show bgp ipv4 unicast neighbors json"
    cli_type: "vtysh"
    expected_output: "JSON formatted neighbor information"

  # ========================================
  # BGP Route Display (TC-026 to TC-040)
  # ========================================

  TC-026:
    title: "Display all IPv4 BGP routes"
    command: "show bgp ipv4 unicast"
    cli_type: "klish"
    expected_fields:
      - "Network"
      - "Next Hop"

  TC-027:
    title: "Display specific IPv4 route"
    command: "show bgp ipv4 unicast <prefix>"
    cli_type: "klish"
    expected_fields:
      - "Network"
      - "paths available"

  TC-028:
    title: "Display IPv4 routes in CIDR notation"
    command: "show bgp ipv4 unicast cidr-only"
    cli_type: "vtysh"
    expected_fields:
      - "Network"

  TC-029:
    title: "Display IPv4 routes with communities"
    command: "show bgp ipv4 unicast community"
    cli_type: "vtysh"
    expected_output: "Routes with community attributes"

  TC-030:
    title: "Display IPv4 routes with specific community"
    command: "show bgp ipv4 unicast community <community_value>"
    cli_type: "vtysh"
    expected_output: "Routes matching community"

  TC-031:
    title: "Display IPv4 routes with AS-path filter"
    command: "show bgp ipv4 unicast regexp <as_path_regex>"
    cli_type: "vtysh"
    expected_output: "Routes matching AS-path"

  TC-032:
    title: "Display IPv4 routes longer than prefix"
    command: "show bgp ipv4 unicast <prefix> longer-prefixes"
    cli_type: "vtysh"
    expected_output: "More specific routes"

  TC-033:
    title: "Display IPv4 routes with bestpath"
    command: "show bgp ipv4 unicast bestpath"
    cli_type: "vtysh"
    expected_fields:
      - "best"

  TC-034:
    title: "Display all IPv6 BGP routes"
    command: "show bgp ipv6 unicast"
    cli_type: "klish"
    expected_output: "IPv6 routes or no routes"

  TC-035:
    title: "Display specific IPv6 route"
    command: "show bgp ipv6 unicast <ipv6_prefix>"
    cli_type: "klish"
    expected_output: "IPv6 route details"

  TC-036:
    title: "Display BGP routing table"
    command: "show ip bgp"
    cli_type: "vtysh"
    expected_fields:
      - "Network"
      - "Next Hop"

  TC-037:
    title: "Display BGP routes in JSON format"
    command: "show bgp ipv4 unicast json"
    cli_type: "vtysh"
    expected_output: "JSON formatted routes"

  TC-038:
    title: "Display BGP routes with route-map filter"
    command: "show bgp ipv4 unicast route-map <route_map_name>"
    cli_type: "vtysh"
    expected_output: "Filtered routes"

  TC-039:
    title: "Display BGP routes with prefix-list filter"
    command: "show bgp ipv4 unicast prefix-list <prefix_list_name>"
    cli_type: "vtysh"
    expected_output: "Filtered routes"

  TC-040:
    title: "Display BGP routes summary"
    command: "show bgp ipv4 unicast summary-only"
    cli_type: "vtysh"
    expected_output: "Route summary information"

  # ========================================
  # BGP Configuration Display (TC-041 to TC-050)
  # ========================================

  TC-041:
    title: "Display BGP running configuration"
    command: "show running-config bgp"
    cli_type: "vtysh"
    expected_fields:
      - "router bgp"

  TC-042:
    title: "Display BGP configuration via show run"
    command: "show running-config | include bgp"
    cli_type: "vtysh"
    expected_fields:
      - "bgp"

  TC-043:
    title: "Display BGP neighbor configuration"
    command: "show running-config bgp neighbor <neighbor_ip>"
    cli_type: "vtysh"
    expected_fields:
      - "neighbor"

  TC-044:
    title: "Display BGP address-family configuration"
    command: "show running-config bgp address-family"
    cli_type: "vtysh"
    expected_fields:
      - "address-family"

  TC-045:
    title: "Display BGP peer-group configuration"
    command: "show running-config bgp peer-group"
    cli_type: "vtysh"
    expected_output: "Peer-group config or none configured"

  TC-046:
    title: "Display BGP network configuration"
    command: "show running-config bgp network"
    cli_type: "vtysh"
    expected_output: "Network statements"

  TC-047:
    title: "Display BGP redistribute configuration"
    command: "show running-config bgp redistribute"
    cli_type: "vtysh"
    expected_output: "Redistribute statements"

  TC-048:
    title: "Display BGP route-map configuration"
    command: "show running-config route-map"
    cli_type: "vtysh"
    expected_output: "Route-map configuration"

  TC-049:
    title: "Display BGP prefix-list configuration"
    command: "show running-config ip prefix-list"
    cli_type: "vtysh"
    expected_output: "Prefix-list configuration"

  TC-050:
    title: "Display BGP community-list configuration"
    command: "show running-config bgp community-list"
    cli_type: "vtysh"
    expected_output: "Community-list configuration"

  # Note: TC-051 through TC-091 would follow similar structure
  # For brevity, including key examples:

  TC-051:
    title: "Display BGP statistics"
    command: "show bgp statistics"
    cli_type: "vtysh"
    expected_output: "BGP statistics or command not available"

  TC-061:
    title: "Display BGP VRF default summary"
    command: "show bgp vrf default ipv4 unicast summary"
    cli_type: "klish"
    expected_fields:
      - "Neighbor"

  TC-071:
    title: "Display BGP routes filtered by network"
    command: "show bgp ipv4 unicast filter-list"
    cli_type: "vtysh"
    expected_output: "Filtered routes"

  TC-081:
    title: "Negative: Invalid neighbor IP address"
    command: "show bgp ipv4 unicast neighbors 999.999.999.999"
    cli_type: "vtysh"
    expected_output: "Error or invalid message"
    test_type: "negative"

  TC-082:
    title: "Negative: Non-existent neighbor"
    command: "show bgp ipv4 unicast neighbors 192.168.99.99"
    cli_type: "vtysh"
    expected_output: "Neighbor not found or no such neighbor"
    test_type: "negative"

  TC-083:
    title: "Negative: Invalid AFI/SAFI combination"
    command: "show bgp ipv4 multicast summary"
    cli_type: "vtysh"
    expected_output: "No neighbors or command not supported"
    test_type: "negative"

  TC-084:
    title: "Negative: Invalid VRF name"
    command: "show bgp vrf non_existent_vrf ipv4 unicast summary"
    cli_type: "klish"
    expected_output: "VRF not found or error"
    test_type: "negative"

  TC-085:
    title: "Negative: Invalid route prefix format"
    command: "show bgp ipv4 unicast 192.168.1"
    cli_type: "vtysh"
    expected_output: "Invalid prefix or error"
    test_type: "negative"

  TC-086:
    title: "Negative: Invalid AS-path regex"
    command: "show bgp ipv4 unicast regexp [invalid-regex"
    cli_type: "vtysh"
    expected_output: "Invalid regex or error"
    test_type: "negative"

  TC-087:
    title: "Negative: Non-existent community"
    command: "show bgp ipv4 unicast community 65000:999999"
    cli_type: "vtysh"
    expected_output: "No routes or empty"
    test_type: "negative"

  TC-088:
    title: "Negative: Invalid JSON format request"
    command: "show bgp ipv4 unicast invalid-format"
    cli_type: "vtysh"
    expected_output: "Invalid command or error"
    test_type: "negative"

  TC-089:
    title: "Negative: Non-existent route-map"
    command: "show bgp ipv4 unicast route-map NON_EXISTENT_MAP"
    cli_type: "vtysh"
    expected_output: "No routes or route-map not found"
    test_type: "negative"

  TC-090:
    title: "Negative: Non-existent prefix-list"
    command: "show bgp ipv4 unicast prefix-list NON_EXISTENT_LIST"
    cli_type: "vtysh"
    expected_output: "No routes or prefix-list not found"
    test_type: "negative"

  TC-091:
    title: "Negative: Invalid neighbor attribute"
    command: "show bgp neighbors <neighbor_ip> invalid-attribute"
    cli_type: "vtysh"
    expected_output: "Invalid command or error"
    test_type: "negative"
