# VLAN Create with Valid Range - TC_VLAN_CREATE_003 Configuration
#
# This configuration file contains test variables for TC_VLAN_CREATE_003:
# Create VLAN with Valid Range
#
# Test Objective: Verify VLAN creation with valid VLAN IDs (1-4094)
#
# Date: 2026-05-11
# Author: Test Automation Team

defaults:
  # CLI Type: klish | click | rest-patch | rest-put | gnmi
  cli_type: klish

  # VLAN ID Range
  vlan_min: 1           # Minimum valid VLAN ID (default VLAN)
  vlan_max: 4094        # Maximum valid VLAN ID per IEEE 802.1Q standard

  # Test behavior
  cleanup: true         # Clean up VLANs after test completion

  # Topology requirement
  min_topology:
    - "D1D2:2"          # Two-node topology with 2+ interconnects

testcases:
  # TC_VLAN_CREATE_003 specific configuration
  TC_VLAN_CREATE_003:
    description: "Create VLAN with Valid Range (1-4094)"
    objective: "Verify VLAN creation with boundary valid VLAN IDs"
    vlans_to_test:
      - id: 1
        name: "default_vlan"
        description: "Default VLAN 1"
        is_boundary: true
      - id: 4094
        name: "max_vlan"
        description: "Maximum VLAN ID"
        is_boundary: true

# Logging and verbosity
logging:
  level: debug
  show_step_details: true
  show_configuration: true

# Timeout values (seconds)
timeouts:
  vlan_creation: 30
  vlan_verification: 30
  config_save: 10

# Error handling
error_handling:
  skip_on_error: false        # Do not skip remaining steps on error
  continue_on_failure: true   # Continue testing even if a step fails
  collect_diagnostics: true   # Collect show commands on failure
