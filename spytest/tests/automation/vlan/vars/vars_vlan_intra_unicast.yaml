# VLAN Intra-VLAN Unicast Forwarding Test Variables (TC_VLAN_FORWARD_001)
# Author: Test Automation Team
# Date: 2026-05-06
#
# This YAML file contains configuration for TC_VLAN_FORWARD_001: Intra-VLAN Unicast Forwarding
#
# Test Scenario:
#   Verify that unicast packets sent from one access port are forwarded only to
#   the destination access port in the same VLAN (not flooded to other ports).
#   The test creates VLAN 10, configures two access ports, sends unicast Ethernet
#   frames, and verifies reception only on the destination port.
#
# Test Logic:
#   Source: Port1 on DUT1 (configured as access port in VLAN 10)
#   Destination: Port2 on DUT2 (configured as access port in VLAN 10)
#   Operation: Send unicast packets from Port1 to Port2 (known destination MAC)
#   Verification: Only Port2 receives packets (no flooding or broadcast)
#

defaults:
  # CLI Type: Use klish for all commands
  cli_type: klish

  # Topology requirement: Two DUTs with 2+ connections
  # Format: "D1D2:2" means DUT1-DUT2 with 2 connections
  min_topology:
    - "D1D2:2"

  # Verification timeout in seconds
  verify_timeout: 30

  # Enable cleanup after test (remove VLANs and port configs)
  cleanup: true

  # VLAN ID for unicast forwarding test
  vlan_id: "10"

testcases:
  # TC_VLAN_FORWARD_001: Intra-VLAN Unicast Forwarding
  "TC_VLAN_FORWARD_001":
    title: "Intra-VLAN Unicast Forwarding"

    description: |
      Verify that unicast packets are forwarded only to the destination port
      in the same VLAN. The test creates VLAN 10, configures two untagged
      access ports, sends unicast Ethernet frames from Port1 to Port2's MAC,
      and verifies that only Port2 receives the packets (no flooding).

    test_type: "vlan_intra_vlan_unicast_forwarding"

    # VLAN Configuration
    vlans:
      # VLAN 10 for unicast forwarding
      vlan_10: 10

    # Port Configuration
    ports:
      # Port1 (access port on D1 - sender)
      port1:
        vlans: [10]           # Allowed VLANs on access port
        mode: "access"        # Access port mode
        state: "up"           # Port state
        shutdown: false       # Port not shutdown
        native_vlan: 1        # Native VLAN (not used on access)

      # Port2 (access port on D2 - receiver)
      port2:
        vlans: [10]           # Allowed VLANs on access port
        mode: "access"        # Access port mode
        state: "up"           # Port state
        shutdown: false       # Port not shutdown
        native_vlan: 1        # Native VLAN (not used on access)

    # Traffic Generation Parameters
    traffic:
      # Packet generation method
      method: "scapy"

      # Number of unicast packets to send
      packet_count: 10

      # Packet size in bytes
      packet_size: 64

      # Packet type (unicast L2 Ethernet frame)
      packet_type: "ethernet"

      # Packet rate (pps = packets per second)
      packet_rate: 1000

      # Traffic duration in seconds
      duration: 5

      # Frame format
      frame_format:
        type: "ethernet"           # L2 Ethernet frame
        src_mac: "auto"            # Auto-discover from Port1
        dst_mac: "auto"            # Auto-discover from Port2 (unicast destination)
        vlan_tag: null             # No VLAN tag (untagged)
        vlan_priority: 0           # N/A for untagged
        ethertype: "0x0800"        # IPv4

    # Capture Configuration
    capture:
      # Packet capture method
      method: "tcpdump"

      # Interface to capture on (Port2)
      interface: "Port2"

      # Capture filters (capture unicast frames to Port2's MAC)
      bpf_filter: "ether dst Port2_MAC"

      # Capture timeout
      timeout: 30

      # Output format
      output_format: "pcap"

      # Keep capture file for analysis
      keep_pcap: false

    # Verification Parameters
    verification:
      # Verify VLAN configuration
      verify_vlan_config: true

      # Verify port configuration as access ports
      verify_port_config: true

      # Verify packet capture
      verify_capture: true

      # Verify packets are unicast (not broadcast/multicast)
      verify_unicast: true

      # Expected behavior: only unicast packets (not flooded)
      expected_unicast_only: true

      # Acceptable packet loss percentage
      max_packet_loss_percent: 20

      # Verify using running-configuration
      use_show_running_config: true

    # Logging Configuration
    logging:
      # Log level: "debug", "info", "warning", "error"
      level: "debug"

      # Log captured packets in detail
      log_packets: true

      # Log interface counters
      log_counters: true

      # Log configuration changes
      log_config: true

      # Log MAC address discovery
      log_mac_discovery: true

      # Log forwarding decisions
      log_forwarding: true

    # Packet Capture Configuration
    packet_capture:
      # Enable packet capture
      enabled: true

      # Capture file location
      capture_path: "/tmp/vlan_unicast_forward_10.pcap"

      # Filter for destination MAC (Port2)
      dst_mac_filter: "auto"

      # Capture interface timeout (seconds)
      capture_timeout: 30

      # Number of expected packets
      expected_packets: 10

    # Forwarding Verification
    forwarding:
      # Verify unicast forwarding (not flooding)
      verify_no_flooding: true

      # Verify destination port receives packets
      verify_destination_port: true

      # Verify other ports do NOT receive packets
      verify_no_other_ports: false  # Not testable with single capture point

      # Unicast detection sensitivity
      # Unicast: LSB of first MAC byte = 0 and not FF:FF:FF:FF:FF:FF
      unicast_detection_strict: true

    # Error Handling
    error_handling:
      # Continue on minor errors
      continue_on_error: false

      # Save diagnostic data on failure
      save_diagnostics: true

      # Diagnostic capture location
      diagnostics_path: "/tmp/vlan_unicast_forward_diagnostics"

    # Cleanup Configuration
    cleanup:
      # Clean up VLANs
      cleanup_vlans: true

      # Clean up port configurations
      cleanup_ports: true

      # Clean up pcap files
      cleanup_pcaps: true

      # Cleanup order (reverse order of creation)
      cleanup_order:
        - "ports"
        - "vlans"
        - "pcaps"

# Global Test Parameters (overrides per-test defaults if applicable)
global:
  # Packet capture retention
  retain_pcaps: false

  # Diagnostic level on failure
  diagnostics_level: "full"

  # Test retry on failure
  max_retries: 0

  # Test timeout in seconds
  test_timeout: 300

  # Interface link speed detection
  auto_detect_speed: true

  # MTU verification
  verify_mtu: false

  # MAC address refresh interval
  mac_refresh_interval: 10

# Integration Parameters (for CI/CD systems)
integration:
  # Enable integration mode
  enabled: false

  # CI/CD system type: "jenkins", "gitlab", "github", "azure"
  ci_system: "github"

  # Report format: "junit", "html", "json"
  report_format: "junit"

  # Report output location
  report_path: "/tmp/vlan_unicast_forward_report"

  # Metrics collection
  collect_metrics: false
