# VLAN Operational Status Validation - Test Variables
# Test Case: SM_ISCLI_P2_109 (SONIC-VLAN-STAT-001)
# Author: Shiva
# Copyright (C) 2026

# Default settings for all test cases
defaults:
  cli_type: klish                # Use IS-CLI (klish) mode
  verify_timeout: 10             # Timeout for verification polling (seconds)
  ping_count: 3                  # Number of ping packets to send
  ping_timeout: 5                # Ping timeout (seconds)
  shutdown_wait: 2               # Wait time after interface shutdown (seconds)
  convergence_wait: 5            # Wait time for network convergence (seconds)
  cleanup: true                  # Enable cleanup after tests
  min_topology:
    - "D1D2:1"                   # Minimum topology: 2 DUTs with 1 link between them

# Test case definitions
testcases:
  # TC 1: Positive - VLAN Status UP with Active Member Port
  "vlan_status_positive":
    title: "Verify VLAN status is UP when member port is active"
    description: "Configure VLAN 20 with IP addresses on both DUTs, add physical port as member, verify VLAN status is UP and ping succeeds"
    vlan_id: "20"
    dut1:
      alias: "D1"
      vlan_ip: "10.0.1.1/25"
      vlan_ip_addr: "10.0.1.1"
      vlan_subnet: "25"
    dut2:
      alias: "D2"
      vlan_ip: "10.0.1.2/25"
      vlan_ip_addr: "10.0.1.2"
      vlan_subnet: "25"
    # Physical interface will be read from topology (D1D2P1)
    tagging_mode: false           # Untagged (access) mode
    expected_vlan_status: "up"
    expected_intf_status: "up"
    verify:
      ping_required: true
      vlan_status: "up"
      interface_admin: "up"
      interface_oper: "up"

  # TC 2: Negative - VLAN Status DOWN when Member Port is Shutdown
  "vlan_status_negative":
    title: "Verify VLAN status transitions to DOWN when member port is shutdown"
    description: "Shutdown the physical port member of VLAN 20, verify VLAN status changes to DOWN"
    vlan_id: "20"
    shutdown_dut: "D1"
    expected_vlan_status: "down"
    expected_intf_admin: "down"
    verify:
      vlan_status: "down"
      interface_admin: "down"

  # TC 3: Recovery - VLAN Status UP after Member Port Re-enabled
  "vlan_status_recovery":
    title: "Verify VLAN status returns to UP when member port is re-enabled"
    description: "Re-enable the shutdown physical port, verify VLAN status returns to UP and connectivity is restored"
    vlan_id: "20"
    startup_dut: "D1"
    expected_vlan_status: "up"
    expected_intf_status: "up"
    verify:
      ping_required: true
      vlan_status: "up"
      interface_admin: "up"
      interface_oper: "up"
