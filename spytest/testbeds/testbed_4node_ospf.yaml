version: 2.0
devices:
  # D1 - 192.168.100.194 (smic_sonic1 - Primary Hardware DUT)
  smic_sonic1:
    device_type: sonic
    access: {protocol: ssh, ip: 192.168.100.62, port: 22}
    credentials: {username: admin, password: root@123, altpassword: root@123}
    properties: {services: default, build: default, config: default, errors: default}

  # D2 - 192.168.100.233 (smic_sonic2 - Secondary Hardware DUT)
  smic_sonic2:
    device_type: sonic
    access: {protocol: ssh, ip: 192.168.100.245, port: 22}
    credentials: {username: admin, password: root@123, altpassword: root@123}
    properties: {services: default, build: default, config: default, errors: default}

  # D3 - 192.168.100.225 (vs_sonic_3 - Virtual Switch 1)
  vs_sonic_3:
    device_type: sonic
    access: {protocol: ssh, ip: 192.168.100.25, port: 22}
    credentials: {username: admin, password: root@123, altpassword: root@123}
    properties: {services: default, build: default, config: default, errors: default}

  # D4 - 192.168.100.143 (vs_sonic_4 - Virtual Switch 2)
  vs_sonic_4:
    device_type: sonic
    access: {protocol: ssh, ip: 192.168.100.170, port: 22}
    credentials: {username: admin, password: root@123, altpassword: root@123}
    properties: {services: default, build: default, config: default, errors: default}

topology:
  # D1 (smic_sonic1) connections
  smic_sonic1:
    interfaces:
      # D1 ↔ D2 Link (PortChannel10/VLAN10)
      Ethernet0: {EndDevice: smic_sonic2, EndPort: Ethernet0}
      # D1 ↔ D3 Link
      Ethernet16: {EndDevice: vs_sonic_3, EndPort: Ethernet0}

  # D2 (smic_sonic2) connections
  smic_sonic2:
    interfaces:
      # D2 ↔ D1 Link (PortChannel10/VLAN10)
      Ethernet0: {EndDevice: smic_sonic1, EndPort: Ethernet0}
      # D2 ↔ D4 Link (PortChannel20/VLAN20)
      Ethernet4: {EndDevice: vs_sonic_4, EndPort: Ethernet0}

  # D3 (vs_sonic_3) connections
  vs_sonic_3:
    interfaces:
      # D3 ↔ D1 Link
      Ethernet0: {EndDevice: smic_sonic1, EndPort: Ethernet16}
      # D3 ↔ D4 Link (PortChannel30/VLAN30)
      Ethernet4: {EndDevice: vs_sonic_4, EndPort: Ethernet4}

  # D4 (vs_sonic_4) connections
  vs_sonic_4:
    interfaces:
      # D4 ↔ D2 Link (PortChannel20/VLAN20)
      Ethernet0: {EndDevice: smic_sonic2, EndPort: Ethernet4}
      # D4 ↔ D3 Link (PortChannel30/VLAN30)
      Ethernet4: {EndDevice: vs_sonic_3, EndPort: Ethernet4}

services: {default: {}}
builds:   {default: {}}
configs:  {default: {}}
errors:   {default: {}}
params:   {}
