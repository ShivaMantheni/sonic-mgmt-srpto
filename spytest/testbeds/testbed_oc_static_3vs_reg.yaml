# Testbed configuration for OC Static Route testing
# 3-node linear topology: D1 <-> D2 <-> D3 (2 links between each pair)
# Build: OC-build (OpenConfig integration)
# Uses D1, D2, D3 from 6-node regression topology

version: 2.0

devices:
  # D1 - 192.168.100.35 (Primary source device)
  D1:
    device_type: sonic
    access:
      protocol: ssh
      ip: 192.168.100.35
      port: 22
    credentials:
      username: admin
      password: root@123
      altpassword: YourPaSsWoRd
    properties:
      services: default
      build: default
      config: default
      errors: default

  # D2 - 192.168.100.36 (Middle device - transit)
  D2:
    device_type: sonic
    access:
      protocol: ssh
      ip: 192.168.100.36
      port: 22
    credentials:
      username: admin
      password: root@123
      altpassword: YourPaSsWoRd
    properties:
      services: default
      build: default
      config: default
      errors: default

  # D3 - 192.168.100.37 (Destination device)
  D3:
    device_type: sonic
    access:
      protocol: ssh
      ip: 192.168.100.37
      port: 22
    credentials:
      username: admin
      password: root@123
      altpassword: YourPaSsWoRd
    properties:
      services: default
      build: default
      config: default
      errors: default

topology:
  # D1 connections
  D1:
    interfaces:
      # D1 Ethernet0 <-> D2 Ethernet0
      Ethernet0:
        EndDevice: D2
        EndPort: Ethernet0
      # D1 Ethernet4 <-> D2 Ethernet4
      Ethernet4:
        EndDevice: D2
        EndPort: Ethernet4

  # D2 connections
  D2:
    interfaces:
      # D2 Ethernet0 <-> D1 Ethernet0
      Ethernet0:
        EndDevice: D1
        EndPort: Ethernet0
      # D2 Ethernet4 <-> D1 Ethernet4
      Ethernet4:
        EndDevice: D1
        EndPort: Ethernet4
      # D2 Ethernet8 <-> D3 Ethernet8
      Ethernet8:
        EndDevice: D3
        EndPort: Ethernet8
      # D2 Ethernet12 <-> D3 Ethernet12
      Ethernet12:
        EndDevice: D3
        EndPort: Ethernet12

  # D3 connections
  D3:
    interfaces:
      # D3 Ethernet8 <-> D2 Ethernet8
      Ethernet8:
        EndDevice: D2
        EndPort: Ethernet8
      # D3 Ethernet12 <-> D2 Ethernet12
      Ethernet12:
        EndDevice: D2
        EndPort: Ethernet12

services: {default: {}}
builds:   {default: {}}
configs:  {default: {}}
errors:   {default: {}}
params:   {}
