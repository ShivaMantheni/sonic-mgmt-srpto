version: 2.0
devices:
  # D1 - 192.168.100.144 (DUT1 - Primary device)
  smic_sonic1:
    device_type: sonic
    access: {protocol: ssh, ip: 192.168.100.62, port: 22}
    credentials: {username: admin, password: root@123, altpassword: root@123}
    properties: {services: default, build: default, config: default, errors: default}

  # D2 - 192.168.100.248 (DUT2 - Secondary device)
  smic_sonic2:
    device_type: sonic
    access: {protocol: ssh, ip: 192.168.100.245, port: 22}
    credentials: {username: admin, password: root@123, altpassword: root@123}
    properties: {services: default, build: default, config: default, errors: default}

topology:
  # D1 (smic_sonic1) connections - Updated to match physical LLDP topology
  smic_sonic1:
    interfaces:
      # D1 ↔ D2 Basic ARP tests (Tests 1-5, 8-20)
      Ethernet32: {EndDevice: smic_sonic2, EndPort: Ethernet32}
      # D1 ↔ D2 Proxy ARP / VLAN tests (Test 3, 6)
      Ethernet36: {EndDevice: smic_sonic2, EndPort: Ethernet36}
      # D1 ↔ D2 PortChannel member 1 (Test 7)
      Ethernet40: {EndDevice: smic_sonic2, EndPort: Ethernet40}
      # D1 ↔ D2 PortChannel member 2 (Test 7)
      Ethernet44: {EndDevice: smic_sonic2, EndPort: Ethernet44}

  # D2 (smic_sonic2) connections
  smic_sonic2:
    interfaces:
      # D2 ↔ D1 Basic ARP tests (Tests 1-5, 8-20)
      Ethernet32: {EndDevice: smic_sonic1, EndPort: Ethernet32}
      # D2 ↔ D1 Proxy ARP / VLAN tests (Test 3, 6)
      Ethernet36: {EndDevice: smic_sonic1, EndPort: Ethernet36}
      # D2 ↔ D1 PortChannel member 1 (Test 7)
      Ethernet40: {EndDevice: smic_sonic1, EndPort: Ethernet40}
      # D2 ↔ D1 PortChannel member 2 (Test 7)
      Ethernet44: {EndDevice: smic_sonic1, EndPort: Ethernet44}

services: {default: {}}
builds:   {default: {}}
configs:  {default: {}}
errors:   {default: {}}
params:   {}
