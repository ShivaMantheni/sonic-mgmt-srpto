# ACL Test Testbed Configuration - 3 Hardware SONiC DUTs
# Created: 2026-03-17
# Updated: 2026-04-24 - New topology with 8030 as intermediate device
# Topology: Three Hardware SONiC DUTs with L3 ACL traffic through 8030

# Topology Diagram:
#   ┌──────────────┐                    ┌──────────────┐                    ┌──────────────┐
#   │   DUT1       │                    │   DUT2       │                    │   DUT3       │
#   │ (ACL Device) │                    │(Intermediate)│                    │  (RX Host)   │
#   │    8011      │                    │    8030      │                    │    8010      │
#   │192.168.100.51│                    │192.168.100.111                    │192.168.100.56│
#   │              │                    │              │                    │              │
#   │              │                    │              │                    │              │
#   │ Ethernet272◄─┼────────────────────┼──Ethernet48  │                    │              │
#   │              │                    │  (port13)    │                    │              │
#   │              │                    │              │                    │              │
#   │ Ethernet513──┼────────────────────┼──────────────┼────────────────────┼──►Ethernet513│
#   │              │                    │              │                    │              │
#   └──────────────┘                    └──────────────┘                    └──────────────┘
#
# Physical Connection Details:
#   Link 1: 8011:Ethernet272 (port37) ←→ 8030:Ethernet38 (port13)
#   Link 2: 8011:Ethernet272 ←→ 8030:Ethernet48 (port13)
#   Link 3: 8011:Ethernet513 ←→ 8010:Ethernet513
#
# Traffic Flow: 8011 (ACL Device) ←→ 8030 (Intermediate) and 8011 ←→ 8010 (RX Host)
# Verification: Tcpdump on DUT3:Ethernet513 captures packets via pcap file

version: 2.0

devices:
  D1:
    device_type: sonic
    access:
      protocol: ssh
      ip: 192.168.100.51
      port: 22
    credentials:
      username: admin
      password: sonic@123
      altpassword: YourPaSsWoRd
    properties:
      services: default
      build: default
      config: default
      errors: default
      params: def_dut
      cli_type: klish
    description: "ACL Device Under Test (D1) - 8011 - Hardware SONiC Switch (klish CLI)"

  D2:
    device_type: sonic
    access:
      protocol: ssh
      ip: 192.168.100.111
      port: 22
    credentials:
      username: admin
      password: broadcom
      altpassword: YourPaSsWoRd
    properties:
      services: default
      build: default
      config: default
      errors: default
      params: def_intermediate
      cli_type: klish
    description: "Intermediate Device (D2) - 8030 - Hardware SONiC Switch (klish CLI)"

  D3:
    device_type: sonic
    access:
      protocol: ssh
      ip: 192.168.100.56
      port: 22
    credentials:
      username: admin
      password: sonic@123
      altpassword: YourPaSsWoRd
    properties:
      services: default
      build: default
      config: default
      errors: default
      params: def_tg_rx
      cli_type: klish
    description: "RX Traffic Sink (D3) - 8010 - Receives and verifies via tcpdump (klish CLI)"

topology:
  D1:
    interfaces:
      Ethernet272: {EndDevice: D2, EndPort: Ethernet48, params: def_link}
      Ethernet513: {EndDevice: D3, EndPort: Ethernet513, params: def_link}
  D2:
    interfaces:
      Ethernet48: {EndDevice: D1, EndPort: Ethernet272, params: def_link}
  D3:
    interfaces:
      Ethernet513: {EndDevice: D1, EndPort: Ethernet513, params: def_link}

# Service definitions
services:
  default:
    name: default

# Build definitions
builds:
  default:
    name: default

# Configuration profiles
configs:
  default:
    name: default
    current: []
    restore: []

# Error patterns
errors:
  default: {}

# Parameters for devices and links
params:
  def_dut:
    description: "DUT (Device Under Test) - 8011 (192.168.100.51)"
    management_ip: "192.168.100.51"
    hostname: "8011"

  def_intermediate:
    description: "Intermediate SONiC Device (D2) - 8030 (192.168.100.111)"
    type: sonic
    hostname: "8030"
    mgmt_ip: "192.168.100.111"
    role: "intermediate"

  def_tg_rx:
    description: "RX SONiC Host (D3) - 8010 (192.168.100.56) - Receives and verifies traffic via tcpdump"
    type: sonic
    hostname: "8010"
    mgmt_ip: "192.168.100.56"
    role: "traffic_generator_rx"

  def_link:
    description: "Link parameters for ACL testing (Hardware interfaces)"
    speed: "40000"
    autoneg: "enable"

# ============================================================================
# TESTBED NOTES
# ============================================================================
# Device Information:
#   8011 (DUT1): 192.168.100.51
#     - Hostname: sonic (SONiC OS on Hardware)
#     - Role: ACL Device (DUT)
#     - Connected links:
#       * Ethernet272 (port37) ↔ 8030:Ethernet38 (port13)
#       * Ethernet272 ↔ 8030:Ethernet48 (port13)
#       * Ethernet513 ↔ 8010:Ethernet513
#     - Credentials: admin / sonic@123
#     - CLI Type: klish (Hardware SONiC)
#
#   8030 (DUT2): 192.168.100.111
#     - Hostname: sonic (SONiC OS on Hardware)
#     - Role: Intermediate Device
#     - Connected links:
#       * Ethernet38 (port13) ↔ 8011:Ethernet272 (port37)
#       * Ethernet48 (port13) ↔ 8011:Ethernet272
#     - Credentials: admin / YourPaSsWoRd
#     - CLI Type: klish (Hardware SONiC)
#
#   8010 (DUT3): 192.168.100.56
#     - Hostname: sonic (SONiC OS on Hardware)
#     - Role: Traffic Sink (RX Host)
#     - Connected link: Ethernet513 ↔ 8011:Ethernet513
#     - Credentials: admin / sonic@123
#     - CLI Type: klish (Hardware SONiC)
#
# Physical Links:
#   Link 1: 8011:Ethernet272 (port37) ↔ 8030:Ethernet38 (port13)
#   Link 2: 8011:Ethernet272 ↔ 8030:Ethernet48 (port13)
#   Link 3: 8011:Ethernet513 ↔ 8010:Ethernet513
#
# Test Execution Flow:
#   1. [Setup] Configure L3 addresses on all interfaces as needed
#   2. [Setup] Create static routes for cross-subnet routing
#   3. [Test] Start tcpdump listener on DUT3:Ethernet513
#   4. [Test] Apply ACL rules on DUT1 interfaces
#   5. [Test] Generate traffic through the topology
#   6. [Verify] DUT3 receives packets on Ethernet513, tcpdump captures to pcap
#   7. [Verify] Parse pcap file using Scapy rdpcap() on DUT3
#   8. [Result] Compare TX count vs RX count, validate ACL behavior
#
# How to Run Tests:
#   ./bin/spytest --testbed testbeds/testbed_acl_hw.yaml \
#       tests/routing/l3_acl/test_l3_acl.py \
#       --logs-path ./logs/l3_acl_hw_$(date +%F_%H%M%S) \
#       --log-level info --skip-init-config
#
# Topology Validation Commands:
#   # Check connectivity
#   ssh -o StrictHostKeyChecking=no admin@192.168.100.51 "hostname"  # DUT1 (8011)
#   ssh -o StrictHostKeyChecking=no admin@192.168.100.111 "hostname"  # DUT2 (8030)
#   ssh -o StrictHostKeyChecking=no admin@192.168.100.56 "hostname"   # DUT3 (8010)
#
#   # Verify interfaces
#   ssh -o StrictHostKeyChecking=no admin@192.168.100.51 "show interfaces status | grep -E 'Ethernet272|Ethernet513'"  # DUT1
#   ssh -o StrictHostKeyChecking=no admin@192.168.100.111 "show interfaces status | grep -E 'Ethernet38|Ethernet48'"    # DUT2
#   ssh -o StrictHostKeyChecking=no admin@192.168.100.56 "show interfaces status | grep Ethernet513"                     # DUT3
#
# Requirements:
#   - All three SONiC DUTs must be reachable via SSH
#   - All DUTs must have Scapy and tcpdump installed (if needed for testing)
#   - Physical links must be connected as specified above
#   - Management IPs must be reachable:
#     * 192.168.100.51 (8011/DUT1)
#     * 192.168.100.111 (8030/DUT2)
#     * 192.168.100.56 (8010/DUT3)
#
# ============================================================================
